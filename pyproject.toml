[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-server"
version = "0.2.3"
description = "리듬업 연습실 예약 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi[standard]>=0.139.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "redis>=6.0.0,<9.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<2.2.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.15.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires local PostgreSQL or Redis services",
]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
